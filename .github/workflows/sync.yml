# Copies new releases of the repos in sources.txt into the pacman repository (a release of this repository tagged "repo").
# Hourly, when sources.txt changes, or by hand (Actions -> sync -> Run workflow).
name: sync

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [sources.txt, packages/**, scripts/sync.sh, .github/workflows/sync.yml]

permissions:
  contents: write

concurrency:
  group: sync

jobs:
  sync:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed github-cli gnupg git base-devel

      - uses: actions/checkout@v4

      - name: Build packages/
        run: |
          useradd -m builder
          mkdir -p /tmp/local-pkgs
          for d in packages/*/; do
              [ -f "$d/PKGBUILD" ] || continue
              rm -rf /home/builder/b && mkdir /home/builder/b && cp -r "$d"/. /home/builder/b/
              chown -R builder:builder /home/builder/b
              runuser -u builder -- bash -c 'cd ~/b && makepkg -f --noconfirm --nodeps'
              cp /home/builder/b/*.pkg.tar.zst /tmp/local-pkgs/
          done
          ls -l /tmp/local-pkgs

      - name: Sync
        env:
          LOCAL_PKGS: /tmp/local-pkgs
          GH_TOKEN: ${{ github.token }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./scripts/sync.sh
